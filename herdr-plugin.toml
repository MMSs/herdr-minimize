id = "mmss.minimize"
name = "Minimize"
version = "0.1.0"
# 0.9.3 is the version every herdr behaviour in docs/herdr-api-notes.md was verified against.
min_herdr_version = "0.9.3"
description = "Minimize panes to a clickable tray and restore them to their exact place"
# Windows is out of scope for v1 (docs/design.md).
platforms = ["macos", "linux"]

# herdr never installs toolchains. Fail the install early, with an install hint,
# when bun is missing or too old, instead of failing on the first keypress.
[[build]]
command = ["sh", "scripts/preflight.sh"]

# Entrypoints ([[actions]], [[panes]], [[startup]], [[events]]) are added as they
# are implemented; see docs/design.md for the planned set.
